  #   container_name: typesense
  #   image: typesense/typesense:30.2
  #   restart: on-failure
  #   ports:
  #     - "8108:8108"
  #   volumes:
  #     - ./typesense-data:/data
  #   command: '--data-dir /data --api-key=Yltmyya2008! --enable-cors'
  #   networks:
  #     - backend

networks:
  frontend:
  backend:

volumes:
  mariadb:
