services:
  
  resourcespace:
    build: .
    container_name: resourcespace
    restart: unless-stopped
    depends_on:
      - mariadb
    volumes:
      # - rs_local_system:/var/www/html/filestore/system
      # - rs_local_tmp:/var/www/html/filestore/tmp
      # - ./filestore/original:/var/www/html/filestore/original
      # - ./filestore/resized:/var/www/html/filestore/resized
      - ./config.php:/var/www/html/include/config.php
      - ./filestore:/var/www/html/filestore
    networks:
      - frontend
      - backend
    ports:
      - "8010:80"

  mariadb:
    image: mariadb
    container_name: mariadb
    restart: unless-stopped
    env_file:
      - db.env
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - backend
      - frontend
